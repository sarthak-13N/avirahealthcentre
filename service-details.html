<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Details – Avira Health Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="logo1.ico" type="image/x-icon"/>
  <style>
    :root {
      --primary: #27ae60;
      --primary-dark: #219653;
      --secondary: #2c3e50;
      --secondary-light: #34495e;
      --accent: #e74c3c;
      --light: #ffffff;
      --text-muted: #7f8c8d;
      --text-light: #bdc3c7;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.15);
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      margin-top: 80px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .card img.main-img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      object-position: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 30px 0;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      transition: var(--transition);
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-hover);
    }

    .card-body {
      padding: 30px;
    }

    .card-body h1 {
      font-size: 2.5rem;
      color: var(--secondary);
      margin-bottom: 15px;
      font-weight: 700;
      position: relative;
      padding-bottom: 10px;
    }

    .card-body h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 80px;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    .description {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 25px;
      white-space: pre-line;
    }

    .price-range {
      font-weight: 600;
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .price-range i {
      font-size: 1.5rem;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 30px;
    }

    .btn {
      padding: 14px 25px;
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      text-align: center;
      flex: 1;
      max-width: 220px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-call { 
      background: var(--secondary); 
    }
    .btn-call:hover { 
      background: var(--secondary-light); 
    }
    
    .btn-book { 
      background: var(--primary); 
    }
    .btn-book:hover { 
      background: var(--primary-dark); 
    }
    
    .btn-whatsapp { 
      background: #25d366; 
    }
    .btn-whatsapp:hover { 
      background: #128C7E; 
    }

    .loading, .error {
      text-align: center;
      margin: 100px 0;
      font-size: 1.3rem;
      color: var(--accent);
    }

    .loading i, .error i {
      font-size: 2rem;
      display: block;
      margin-bottom: 15px;
    }

    nav.navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      background: #fff;
      box-shadow: var(--shadow);
      z-index: 1000;
    }

    nav .logo img {
      height: 55px;
      transition: var(--transition);
    }

    nav .logo img:hover {
      transform: scale(1.05);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .nav-links li a {
      text-decoration: none;
      color: var(--secondary);
      font-weight: 600;
      font-size: 1.05rem;
      position: relative;
      padding: 5px 0;
      transition: var(--transition);
    }

    .nav-links li a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: var(--transition);
    }

    .nav-links li a:hover {
      color: var(--primary);
    }

    .nav-links li a:hover::after {
      width: 100%;
    }

    @media (max-width: 992px) {
      .container {
        max-width: 95%;
      }
      
      .gallery img {
        height: 220px;
      }
      
      .card-body h1 {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 768px) {
      .container {
        margin-top: 70px;
        padding: 15px;
      }
      
      .card img.main-img {
        height: 300px;
      }
      
      .gallery {
        grid-template-columns: 1fr;
      }
      
      .gallery img {
        height: 250px;
      }
      
      .card-body {
        padding: 20px;
      }
      
      .card-body h1 {
        font-size: 1.8rem;
      }
      
      .button-group {
        flex-direction: column;
      }
      
      .btn {
        max-width: 100%;
      }
      
      nav.navbar {
        padding: 12px 20px;
      }
      
      .nav-links {
        display: none;
      }
    }

    @media (max-width: 576px) {
      .card img.main-img {
        height: 250px;
      }
      
      .gallery img {
        height: 200px;
      }
      
      .card-body h1 {
        font-size: 1.6rem;
      }
      
      .description {
        font-size: 1rem;
      }
      
      .price-range {
        font-size: 1.1rem;
      }
    }

    /* Animation for loading */
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .loading i {
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <a href="index.html"><img src="logo.jpg" alt="Avira Health Centre Logo" /></a>
    </div>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#services">Therapies</a></li>
      <li><a href="index.html#conditions">Health Benefits</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="booking-form.html">Book At Home</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- WhatsApp Floating Button -->
<a href="https://wa.me/919545246708" target="_blank"
   style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     z-index: 1000;
     background-color: #25D366;
     width: 60px;
     height: 60px;
     border-radius: 50%;
     display: flex;
     align-items: center;
     justify-content: center;
     box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
     text-decoration: none;
   ">
   <i class="fab fa-whatsapp" style="color: white; font-size: 28px;"></i>
</a>

  <!-- Content -->
  <div class="container">
    <div id="serviceDetails">
      <div class="loading">
        <i class="fas fa-spinner"></i>
        Loading service details...
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('serviceDetails');

      if (!id) {
        container.innerHTML = `
          <div class="error">
            <i class="fas fa-exclamation-triangle"></i>
            Service ID not found in URL.
          </div>`;
        return;
      }

      try {
        const res = await fetch(`https://avirahealthcentre.in:3000/api/admin/services/${id}`);
        if (!res.ok) throw new Error('Service not found');

        const service = await res.json();
        const images = [service.image1, service.image2, service.image3, service.image4, service.image5, service.image6]
          .filter(img => img !== null)
          .map(img => `<img src="https://avirahealthcentre.in:3000/uploads/${img}" alt="${service.title} image" />`)
          .join('');

        container.innerHTML = `
          <div class="card">
            <img class="main-img" src="https://avirahealthcentre.in:3000/uploads/${service.card_image}" alt="${service.title}" />
            <div class="card-body">
              <h1>${service.title}</h1>
              <p class="description">${service.big_description || service.card_description || 'No description available.'}</p>
              <p class="price-range">
                <i class="fas fa-tag"></i>
                Price: ₹${parseFloat(service.min_price).toFixed(0)} - ₹${parseFloat(service.max_price).toFixed(0)}
              </p>

              ${images ? `
                <h2 style="color: var(--secondary); margin-top: 30px; font-size: 1.5rem;">
                  <i class="fas fa-images" style="margin-right: 10px;"></i>Gallery
                </h2>
                <div class="gallery">${images}</div>
              ` : ''}

              <div class="button-group">
                <a href="tel:+919545246708" class="btn btn-call">
                  <i class="fas fa-phone-alt"></i> Call Now
                </a>
                <a href="booking-form.html?service_id=${service.service_id}" class="btn btn-book">
                  <i class="fas fa-calendar-check"></i> Book Now
                </a>
                <a href="https://wa.me/919545246708?text=Hi%2C%20I%20want%20to%20book%20the%20${encodeURIComponent(service.title)}%20service." class="btn btn-whatsapp" target="_blank">
                  <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="error">
            <i class="fas fa-exclamation-circle"></i>
            Failed to load service details. Please try again later.
          </div>`;
      }
    });
  </script>
</body>
</html>
