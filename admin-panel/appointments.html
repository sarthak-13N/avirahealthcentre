<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Appointments</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="/logo1.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/logo1.ico" />
  <style>
    :root {
      --primary: #4361ee;
      --primary-dark: #3a56d4;
      --secondary: #3f37c9;
      --success: #4cc9f0;
      --danger: #f72585;
      --warning: #f8961e;
      --info: #4895ef;
      --light: #f8f9fa;
      --dark: #212529;
      --gray: #6c757d;
      --light-gray: #e9ecef;
      --white: #ffffff;
      --border-radius: 8px;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: var(--dark);
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--light-gray);
    }

    .header-left h1 {
      font-size: 24px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logout-btn {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: var(--border-radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
    }

    .logout-btn:hover {
      background-color: #d1145a;
    }

    .card {
      background-color: var(--white);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      margin-bottom: 30px;
      overflow: hidden;
    }

    .card-header {
      padding: 15px 20px;
      background-color: var(--primary);
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .refresh-btn {
      background-color: var(--white);
      color: var(--primary);
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
    }

    .refresh-btn:hover {
      background-color: var(--light-gray);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background-color: var(--light-gray);
    }

    th,
    td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--light-gray);
    }

    th {
      font-weight: 600;
      color: var(--dark);
    }

    tr:hover {
      background-color: rgba(67, 97, 238, 0.05);
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }

    .status-approved {
      background-color: #d4edda;
      color: #155724;
    }

    .status-cancelled {
      background-color: #f8d7da;
      color: #721c24;
    }

    .payment-status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .payment-paid {
      background-color: #d4edda;
      color: #155724;
    }

    .payment-unpaid {
      background-color: #fff3cd;
      color: #856404;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .action-btn+.action-btn {
      margin-left: 8px;
    }

    .approve-btn {
      background-color: var(--success);
      color: white;
    }

    .approve-btn:hover {
      background-color: #3ab0d6;
    }

    .cancel-btn {
      background-color: var(--danger);
      color: white;
    }

    .cancel-btn:hover {
      background-color: #d1145a;
    }

    .no-data {
      padding: 30px;
      text-align: center;
      color: var(--gray);
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background-color: var(--primary);
      color: white;
      margin-left: 5px;
    }

    .text-muted {
      color: var(--gray);
      font-size: 0.9em;
    }

    .notes-cell {
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Responsive styles */
    @media (max-width: 1200px) {
      .container {
        padding: 15px;
      }

      th,
      td {
        padding: 10px 12px;
      }
    }

    @media (max-width: 992px) {
      table {
        display: block;
        overflow-x: auto;
      }
    }

    @media (max-width: 768px) {

      table,
      thead,
      tbody,
      th,
      td,
      tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 15px;
        border: 1px solid var(--light-gray);
        border-radius: var(--border-radius);
        padding: 10px;
        position: relative;
      }

      td {
        padding: 8px 8px 8px 50%;
        text-align: right;
        position: relative;
        border-bottom: 1px solid var(--light-gray);
      }

      td:last-child {
        border-bottom: none;
      }

      td::before {
        content: attr(data-label);
        position: absolute;
        left: 15px;
        top: 8px;
        font-weight: 600;
        color: var(--dark);
      }

      .action-btns {
        display: flex;
        justify-content: flex-end;
      }
    }

    @media (max-width: 576px) {
      td {
        padding-left: 40%;
      }

      .header-left h1 {
        font-size: 20px;
      }

      .logout-btn {
        padding: 6px 10px;
        font-size: 14px;
      }
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      border-top-color: var(--white);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      color: white;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(150%);
      transition: transform 0.3s ease;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast-success {
      background-color: var(--success);
    }

    .toast-error {
      background-color: var(--danger);
    }

    .toast-icon {
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1><i class="fas fa-tachometer-alt"></i> Admin Dashboard</h1>
      </div>
      <div class="header-right">
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </header>

    <div class="card">
      <div class="card-header">
        <h2><i class="far fa-calendar-alt"></i> Appointments <span class="badge" id="appointmentsCount">0</span></h2>
        <button class="refresh-btn" onclick="fetchAppointments()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div class="card-body">
        <table id="appointmentsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Service</th>
              <th>Date & Time</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="8" class="no-data">Loading appointments...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const token = localStorage.getItem('token');
    const apiBase = 'https://my-backend-hsra.onrender.com/api/admin';

    // Check authentication
    if (!token) {
      showToast('⚠️ Unauthorized. Please login as admin.', 'error');
      setTimeout(() => {
        window.location.href = '/admin-panel/index.html';
      }, 2000);
    }

    // DOM Loaded
    document.addEventListener('DOMContentLoaded', () => {
      fetchAppointments();
    });

    // Toast notification
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} toast-icon"></i>
        ${message}
      `;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Logout function
    function logout() {
      localStorage.removeItem('token');
      showToast('Logged out successfully', 'success');
      setTimeout(() => {
        window.location.href = '/admin-panel/index.html';
      }, 1500);
    }

    // Fetch appointments
    async function fetchAppointments() {
      const tbody = document.querySelector('#appointmentsTable tbody');
      const refreshBtn = document.querySelector('#appointmentsTable').closest('.card').querySelector('.refresh-btn');

      try {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="no-data">
              <i class="fas fa-spinner fa-spin"></i> Loading appointments...
            </td>
          </tr>
        `;

        refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading';

        const res = await fetch(`${apiBase}/appointments`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) {
          throw new Error('Failed to fetch appointments');
        }

        const appointments = await res.json();
        tbody.innerHTML = '';

        if (appointments.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" class="no-data">No appointments found</td>
            </tr>
          `;
          document.getElementById('appointmentsCount').textContent = '0';
          return;
        }

        document.getElementById('appointmentsCount').textContent = appointments.length;

        appointments.forEach(app => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td data-label="ID">${app.appointment_id}</td>
            <td data-label="User">
              <div><strong>${app.user_name}</strong></div>
              <div class="text-muted">${app.email}</div>
              <div class="text-muted">${app.phone}</div>
              <div class="text-muted">User ID: ${app.user_id}</div>
            </td>
            <td data-label="Service">${app.services}</td>
            <td data-label="Date & Time">
              <div>${formatDate(app.appointment_date)}</div>
              <div class="text-muted">${app.appointment_time}</div>
              <div class="text-muted">Created: ${formatDateTime(app.created_at, true)}</div>
              ${app.updated_at !== app.created_at ?
              `<div class="text-muted">Updated: ${formatDateTime(app.updated_at, true)}</div>` : ''}
            </td>
            <td data-label="Payment">
              <span class="payment-status payment-${app.payment_status}">${app.payment_status}</span>
              <div class="text-muted">${app.payment_mode}</div>
            </td>
            <td data-label="Status">
              <span class="status status-${app.status.toLowerCase()}">${app.status}</span>
              ${app.cancel_token ? `<div class="text-muted">Token: ${truncateText(app.cancel_token, 8)}</div>` : ''}
            </td>
            <td data-label="Notes" class="notes-cell" title="${app.notes}">${app.notes || '—'}</td>
            <td data-label="Actions" class="action-btns">
              ${app.status === 'pending' ? `
                <button class="action-btn approve-btn" onclick="approveAppointment(${app.appointment_id})">
                  <i class="fas fa-check"></i> Approve
                </button>
                <button class="action-btn cancel-btn" onclick="cancelAppointment(${app.appointment_id})">
                  <i class="fas fa-times"></i> Cancel
                </button>
              ` : '—'}
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        console.error('Error loading appointments:', err);
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="no-data">
              <i class="fas fa-exclamation-triangle"></i> Failed to load appointments
            </td>
          </tr>
        `;
        showToast('Failed to load appointments', 'error');
      } finally {
        refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
      }
    }

    // Approve appointment
    async function approveAppointment(id) {
      if (!confirm('Are you sure you want to approve this appointment?')) return;

      const approveBtn = document.querySelector(`button.approve-btn[onclick="approveAppointment(${id})"]`);
      const originalText = approveBtn.innerHTML;
      approveBtn.innerHTML = '<span class="spinner"></span> Approving';
      approveBtn.disabled = true;

      try {
        const res = await fetch(`${apiBase}/appointment/approve`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ appointment_id: id })
        });

        if (!res.ok) {
          throw new Error('Failed to approve appointment');
        }

        const data = await res.json();
        showToast(data.msg || 'Appointment approved successfully');
        fetchAppointments();
      } catch (err) {
        console.error('Error approving appointment:', err);
        showToast(err.message || 'Failed to approve appointment', 'error');
      } finally {
        approveBtn.innerHTML = originalText;
        approveBtn.disabled = false;
      }
    }

    // Cancel appointment
    async function cancelAppointment(id) {
      if (!confirm('Are you sure you want to cancel this appointment?')) return;

      const cancelBtn = document.querySelector(`button.cancel-btn[onclick="cancelAppointment(${id})"]`);
      const originalText = cancelBtn.innerHTML;
      cancelBtn.innerHTML = '<span class="spinner"></span> Cancelling';
      cancelBtn.disabled = true;

      try {
        const res = await fetch(`${apiBase}/appointment/cancel/${id}`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) {
          throw new Error('Failed to cancel appointment');
        }

        const data = await res.json();
        showToast(data.msg || 'Appointment cancelled successfully');
        fetchAppointments();
      } catch (err) {
        console.error('Error cancelling appointment:', err);
        showToast(err.message || 'Failed to cancel appointment', 'error');
      } finally {
        cancelBtn.innerHTML = originalText;
        cancelBtn.disabled = false;
      }
    }

    // Helper functions
    function formatDate(dateString) {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('en-US', options);
    }

    function formatDateTime(dateString, short = false) {
      const options = short
        ? { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }
        : { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      return new Date(dateString).toLocaleDateString('en-US', options);
    }

    function truncateText(text, maxLength) {
      if (!text) return '';
      if (text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    }
  </script>
</body>

</html>
