    :root {

    body {

    .services-grid {

      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

    .service-card {

      border-radius: 10px;
      overflow: hidden;
      transition: var(--transition);
      box-shadow: var(--shadow);
      position: relative;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .service-image {
      height: 200px;
      overflow: hidden;
    }

    .service-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;

    .service-content {

    }

    .service-card h3 {

      color: var(--secondary);
      font-size: 1.3rem;
    }

    .service-card p {
      color: var(--text-muted);
      margin: 0;
    }

    .price-tag {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 15px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .error-message {
      text-align: center;
      padding: 40px;
      color: var(--accent);
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      .services-grid {
        grid-template-columns: 1fr;
      }

      .service-image {
        height: 180px;
      }
    }

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const apiUrl = 'https://my-backend-hsra.onrender.com/api/admin/services/type/cupping';
      const container = document.getElementById('services-container');

      async function fetchServices() {
        try {
          const response = await fetch(apiUrl);

          if (!response.ok) {
            throw new Error('Network response was not ok');
          }

          const services = await response.json();

          if (services.length === 0) {
            container.innerHTML = '<div class="error-message">No cupping services found at this time.</div>';
            return;
          }

          renderServices(services);
        } catch (error) {
          console.error('Error fetching services:', error);
          container.innerHTML = `<div class="error-message">Error loading services. Please try again later.</div>`;
        }
      }

      function renderServices(services) {
        container.innerHTML = `
          <div class="services-grid">
            ${services.map(service => `
              <a href="service-details.html?id=${service.service_id}" class="service-card">
                <div class="service-image">
                  <img src="${service.card_image}" alt="${service.title}" loading="lazy">
                </div>
                <div class="service-content">
                  <h3>${service.title}</h3>
                  <p>${service.card_description}</p>
                  <span class="price-tag">₹${service.min_price} - ₹${service.max_price}</span>
                </div>
              </a>
            `).join('')}
          </div>
        `;
      }

      fetchServices();
    });

    document.addEventListener('DOMContentLoaded', () => {
      // Mobile Menu Toggle
      const menuToggle = document.getElementById('mobile-menu');
      const navLinks = document.getElementById('nav-links');

      menuToggle.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        menuToggle.classList.toggle('open');
      });

      // Close menu when clicking on links
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
          menuToggle.classList.remove('open');
        });
      });

      // Navbar scroll effect
      const navbar = document.querySelector('.navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
      });

      // Smooth scrolling for anchor links
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const targetId = this.getAttribute('href');
          const targetElement = document.querySelector(targetId);

          window.scrollTo({
            top: targetElement.offsetTop - 70,
            behavior: 'smooth'
          });
        });
      });
    });
  </script>
