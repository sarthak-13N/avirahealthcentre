<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cupping Services – Avira Health Center</title>
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap"
    rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon & Monogram -->
  <link rel="icon" href="logo1.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="logo1.ico" />
  <style>
    :root {
      --primary: #27ae60;
      --secondary: #2c3e50;
      --accent: #e74c3c;
      --light: #ffffff;
      --dark: #2d3436;
      --text-muted: #7f8c8d;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      padding: 0;
      margin: 0;
      background-color: #f9f9f9;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h2 {
      color: var(--secondary);
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    .section-title p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .service-card {
      background: var(--light);
      border-radius: 10px;
      overflow: hidden;
      transition: var(--transition);
      box-shadow: var(--shadow);
      position: relative;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .service-image {
      height: 200px;
      overflow: hidden;
    }

    .service-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .service-content {
      padding: 20px;
    }

    .service-card h3 {
      margin: 0 0 10px;
      color: var(--secondary);
      font-size: 1.3rem;
    }

    .service-card p {
      color: var(--text-muted);
      margin: 0;
    }

    .price-tag {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 15px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .error-message {
      text-align: center;
      padding: 40px;
      color: var(--accent);
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      .services-grid {
        grid-template-columns: 1fr;
      }

      .service-image {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo">
      <img src="logo.jpg" alt="Avira Health Centre Logo" />
    </div>

    <div class="menu-toggle" id="mobile-menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>

    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#services">Therapies</a></li>
      <li><a href="index.html#conditions">Health Benefits</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="booking-form.html">Book At Home</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/919545246708" target="_blank" style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     z-index: 1000;
     background-color: #25D366;
     width: 60px;
     height: 60px;
     border-radius: 50%;
     display: flex;
     align-items: center;
     justify-content: center;
     box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
     text-decoration: none;
   ">
    <i class="fab fa-whatsapp" style="color: white; font-size: 28px;"></i>
  </a>

  <section class="services">
    <div class="container">
      <div class="section-title">
        <h2>Our Cupping Services</h2>
        <p>Professional cupping therapies to enhance your wellbeing</p>
      </div>

      <div id="services-container">
        <div class="loading">Loading services...</div>
      </div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const apiUrl = 'https://my-backend-hsra.onrender.com/api/admin/services/type/massage';
      const container = document.getElementById('services-container');

      async function fetchServices() {
        try {
          const response = await fetch(apiUrl);

          if (!response.ok) {
            throw new Error('Network response was not ok');
          }

          const services = await response.json();

          if (services.length === 0) {
            container.innerHTML = '<div class="error-message">No cupping services found at this time.</div>';
            return;
          }

          renderServices(services);
        } catch (error) {
          console.error('Error fetching services:', error);
          container.innerHTML = `<div class="error-message">Error loading services. Please try again later.</div>`;
        }
      }

      function renderServices(services) {
        container.innerHTML = `
          <div class="services-grid">
            ${services.map(service => `
              <a href="service-details.html?id=${service.service_id}" class="service-card">
                <div class="service-image">
                  <img src="${service.card_image}" alt="${service.title}" loading="lazy">
                </div>
                <div class="service-content">
                  <h3>${service.title}</h3>
                  <p>${service.card_description}</p>
                  <span class="price-tag">₹${service.min_price} - ₹${service.max_price}</span>
                </div>
              </a>
            `).join('')}
          </div>
        `;
      }

      fetchServices();
    });

    document.addEventListener('DOMContentLoaded', () => {
      // Mobile Menu Toggle
      const menuToggle = document.getElementById('mobile-menu');
      const navLinks = document.getElementById('nav-links');

      menuToggle.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        menuToggle.classList.toggle('open');
      });

      // Close menu when clicking on links
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
          menuToggle.classList.remove('open');
        });
      });

      // Navbar scroll effect
      const navbar = document.querySelector('.navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
      });

      // Smooth scrolling for anchor links
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const targetId = this.getAttribute('href');
          const targetElement = document.querySelector(targetId);

          window.scrollTo({
            top: targetElement.offsetTop - 70,
            behavior: 'smooth'
          });
        });
      });
    });
  </script>

</body>

</html>
